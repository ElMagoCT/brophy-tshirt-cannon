<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark 5 Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --panel-2: #1c2028;
    --line: #272c36;
    --text: #eceef2;
    --mute: #8a909b;
    --red: #ff1f3d;
    --ok: #4cc38a;
    --radius: 12px;
    --font: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; }

  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 28px 32px 8px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  header h1 b { color: var(--red); font-weight: 700; }
  header p { margin: 0; color: var(--mute); font-size: 14px; }
  .seg { margin-left: auto; display: flex; gap: 6px; }

  main { padding: 8px 32px 48px; }
  section { margin-top: 26px; }
  section h2 {
    margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: 10px;
  }
  section h2::before { content: ""; width: 14px; height: 2px; background: var(--red); border-radius: 2px; }
  section h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; font-family: var(--mono); font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }

  .card {
    display: block; width: 100%; padding: 0; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #3a404c; }
  .card:active { transform: scale(.99); }
  .card:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .thumb { aspect-ratio: 3 / 2; background: #15171c; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .4s; }
  .thumb img.on { opacity: 1; }
  .thumb::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.04) 50%, transparent 70%);
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
  }
  .thumb.ready::after { display: none; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .meta { padding: 10px 12px 12px; }
  .meta .n { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .meta .n i { font-style: normal; font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
  .meta .n i.ok { color: var(--ok); }
  .meta .n i.bad { color: var(--red); }
  .meta .d { margin-top: 3px; font-family: var(--mono); font-size: 11px; color: var(--mute); }

  #viewer { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
  #viewer[hidden] { display: none; }
  #stage { position: relative; min-width: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .topbar { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(22,25,32,.85); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:hover { border-color: #3a404c; }
  .icon-btn.on { color: var(--red); border-color: var(--red); }
  .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .title-chip {
    margin-left: 2px; font-weight: 600; font-size: 15px; height: 38px; display: flex; align-items: center;
    padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(22,25,32,.85);
  }
  .title-chip span { font-family: var(--mono); font-size: 11px; color: var(--mute); margin-left: 8px; font-weight: 500; }
  .readout {
    position: absolute; left: 16px; bottom: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
  }
  .readout span {
    font-family: var(--mono); font-size: 11px; color: var(--mute);
    background: rgba(22,25,32,.88); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  }
  .readout b { color: var(--text); font-weight: 500; }
  .readout .ok b { color: var(--ok); }
  .readout .bad b { color: var(--red); }
  .readout i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 28px; }
  .grp { margin-bottom: 18px; }
  .grp > label, .grp > .lbl {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--mute); margin-bottom: 8px;
  }
  #name {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font: 600 15px var(--font); padding: 9px 10px;
  }
  #name:focus { outline: none; border-color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12.5px; cursor: pointer; }
  .chip:hover { border-color: #3a404c; }
  .chip.on { border-color: var(--red); background: rgba(255,31,61,.12); }
  .slider { display: grid; grid-template-columns: 78px 1fr 48px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12.5px; }
  .slider output { font-family: var(--mono); font-size: 11px; color: var(--mute); text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--red); }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; padding: 4px 0; }
  .toggle input { accent-color: var(--red); width: 15px; height: 15px; }
  .color-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  input[type=color] { width: 40px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .btn { padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn:hover { border-color: #3a404c; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #fff; color: #111; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 8px;
    transition: opacity .2s, transform .2s; z-index: 20; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    header, main { padding-left: 16px; padding-right: 16px; }
    .seg { margin-left: 0; }
    #viewer { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 46vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    .thumb::after { animation: none; }
    .card, .thumb img, .toast { transition: none; }
  }
</style>

      <button class="icon-btn" id="prev" aria-label="Previous design"><svg viewBox="0 0 24 24"><path d="M11 18l-6-6 6-6M19 12H5"/></svg></button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= design data ================= */

const RED = '#ff1f3d';
const BASE = {
  layout: 'single', hull: 'spectre', pod: 'slab',
  nose: 0.5, flare: 0.5, chine: 0.5, barrelLen: 28, elev: 20, drumN: 6,
  band: true, skirtGlow: true, underglow: true, rings: true, podBand: true,
  glow: 1, led: RED, backdrop: 'dark', xray: false,
};

const PRESETS = [
  { id: 'spectre',  name: 'Spectre',  layout: 'single',   hull: 'spectre',  pod: 'arrow', nose: 0.85, flare: 0.6, chine: 0.4, barrelLen: 30, elev: 15 },
  { id: 'monolith', name: 'Monolith', layout: 'single',   hull: 'monolith', pod: 'slab',  nose: 0.2,  flare: 0.2, chine: 0.5, barrelLen: 26, elev: 22 },
  { id: 'raptor',   name: 'Raptor',   layout: 'single',   hull: 'raptor',   pod: 'hex',   nose: 0.5,  flare: 0.8, chine: 0.6, barrelLen: 28, elev: 28 },
  { id: 'doorstop', name: 'Doorstop', layout: 'single',   hull: 'doorstop', pod: 'wedge', nose: 0.4,  flare: 0.4, chine: 0.3, barrelLen: 30, elev: 12 },
  { id: 'citadel',  name: 'Citadel',  layout: 'single',   hull: 'citadel',  pod: 'slab',  nose: 0.3,  flare: 0.5, chine: 0.5, barrelLen: 24, elev: 32 },

  { id: 'phantom',  name: 'Phantom',  layout: 'double',   hull: 'spectre',  pod: 'wedge', nose: 0.95, flare: 0.5, chine: 0.5, barrelLen: 28, elev: 18 },
  { id: 'slab',     name: 'Slab',     layout: 'double',   hull: 'monolith', pod: 'hex',   nose: 0.3,  flare: 0.3, chine: 0.6, barrelLen: 26, elev: 25 },
  { id: 'talon',    name: 'Talon',    layout: 'double',   hull: 'raptor',   pod: 'arrow', nose: 0.7,  flare: 0.9, chine: 0.4, barrelLen: 28, elev: 20 },
  { id: 'ramp',     name: 'Ramp',     layout: 'double',   hull: 'doorstop', pod: 'slab',  nose: 0.5,  flare: 0.5, chine: 0.4, barrelLen: 28, elev: 30 },
  { id: 'keep',     name: 'Keep',     layout: 'double',   hull: 'citadel',  pod: 'wedge', nose: 0.4,  flare: 0.6, chine: 0.5, barrelLen: 26, elev: 24 },

  { id: 'wraith',   name: 'Wraith',   layout: 'triple',   hull: 'spectre',  pod: 'hex',   nose: 0.7,  flare: 0.7, chine: 0.5, barrelLen: 28, elev: 20 },
  { id: 'obelisk',  name: 'Obelisk',  layout: 'triple',   hull: 'monolith', pod: 'slab',  nose: 0.25, flare: 0.25,chine: 0.5, barrelLen: 26, elev: 28 },
  { id: 'harrier',  name: 'Harrier',  layout: 'triple',   hull: 'raptor',   pod: 'wedge', nose: 0.6,  flare: 0.85,chine: 0.5, barrelLen: 28, elev: 15 },
  { id: 'glacis',   name: 'Glacis',   layout: 'triple',   hull: 'doorstop', pod: 'arrow', nose: 0.5,  flare: 0.5, chine: 0.3, barrelLen: 30, elev: 22 },
  { id: 'rampart',  name: 'Rampart',  layout: 'triple',   hull: 'citadel',  pod: 'hex',   nose: 0.35, flare: 0.55,chine: 0.5, barrelLen: 26, elev: 35 },

  { id: 'revenant', name: 'Revenant', layout: 'revolver', hull: 'spectre',  pod: 'slab',  nose: 0.8,  flare: 0.6, chine: 0.5, barrelLen: 26, elev: 18, drumN: 6 },
  { id: 'vault',    name: 'Vault',    layout: 'revolver', hull: 'monolith', pod: 'wedge', nose: 0.3,  flare: 0.3, chine: 0.5, barrelLen: 24, elev: 25, drumN: 8 },
  { id: 'kestrel',  name: 'Kestrel',  layout: 'revolver', hull: 'raptor',   pod: 'arrow', nose: 0.6,  flare: 0.8, chine: 0.5, barrelLen: 28, elev: 20, drumN: 5 },
  { id: 'incline',  name: 'Incline',  layout: 'revolver', hull: 'doorstop', pod: 'hex',   nose: 0.45, flare: 0.45,chine: 0.3, barrelLen: 26, elev: 15, drumN: 6 },
  { id: 'bulwark',  name: 'Bulwark',  layout: 'revolver', hull: 'citadel',  pod: 'slab',  nose: 0.3,  flare: 0.5, chine: 0.5, barrelLen: 24, elev: 30, drumN: 7 },
];

const LAYOUTS = { single: 'Single', double: 'Double', triple: 'Triple', revolver: 'Revolving' };
const LAYOUT_NOTE = { single: '', double: 'stacked', triple: 'stacked', revolver: 'one barrel' };
const HULLS = { spectre: 'Spectre', monolith: 'Monolith', raptor: 'Raptor', doorstop: 'Doorstop', citadel: 'Citadel' };
const PODS = { slab: 'Slab', wedge: 'Wedge', hex: 'Hex', arrow: 'Arrow' };
const barrelCount = l => ({ single: 1, double: 2, triple: 3, revolver: 1 }[l]);

/* ================= packaging (inches; x forward, y up, z left/right) =================
   Real parts the body has to hold, from the Tier A BOM:
   - 4x 6" mecanum, FRC stash CIM + Toughbox Mini per corner, track 21", wheelbase 20"
   - 12V SLA battery 7.1 x 3 x 6.6, ZHSYMX compressor 9.6 x 5 x 7.1, electronics tray
   - Viair 2.5 gal tank, 6" x 21.5", mounted across the rear over the back axle
   - per barrel: 3/4" QEV + transverse 4" Sch 40 chamber (~0.94 L) + dump valve + check valve
   - 12V linear actuator for 0-90 deg elevation
   Every body panel is flat: side panels keep a fixed slope, nose and tail are uniform
   scales of the full section, so each facet is a planar trapezoid or triangle.        */

const PK = {
  wheelR: 3, wheelW: 2.2, axleX: 10, wheelZ: 10.5,
  pitch: 3.6, chR: 2.25, chLen: 7.5, qev: [3.4, 3.0, 2.8], barrelR: 1.5, shirtR: 1.65,
  tank: { x: -11, y: 9.9, r: 3, len: 21.5 },
};
const PIVOT_X = { spectre: -1.5, monolith: -2, raptor: -1.5, doorstop: -2.5, citadel: 4.5 };
// belt: LED band height; ks/ku: skirt / upper-side slope (dz per dy); nose and tail are
// uniform scales of the end sections about height noseY / tailY
const HULL_DEF = {
  spectre:  { belt: 6.9, ks: 0.18, ku: 0.16, deckF: 11.2, deckR: 13.9, noseK: 1.0,  noseS: 0.42, noseY: 7.0, tailL: 1.8, tailS: 0.74, tailY: 6.5 },
  monolith: { belt: 7.2, ks: 0.07, ku: 0.10, deckF: 13.4, deckR: 13.9, noseK: 0.35, noseS: 0.84, noseY: 7.5, tailL: 0.9, tailS: 0.9,  tailY: 7.5 },
  raptor:   { belt: 8.6, ks: 0.26, ku: 0.20, deckF: 12.2, deckR: 14.0, noseK: 0.85, noseS: 0.42, noseY: 8.6, tailL: 2.2, tailS: 0.64, tailY: 8.5 },
  doorstop: { belt: 6.6, ks: 0.15, ku: 0.14, deckF: 9.8,  deckR: 15.4, noseK: 0.55, noseS: 0.62, noseY: 4.6, tailL: 0.8, tailS: 0.92, tailY: 8 },
  citadel:  { belt: 7.0, ks: 0.15, ku: 0.14, deckF: 11.8, deckR: 15.4, noseK: 0.6,  noseS: 0.6,  noseY: 6,   tailL: 1.4, tailS: 0.86, tailY: 8, step: [-4.8, -6.8] },
};

function hullStations(c) {
  const H = HULL_DEF[c.hull], nl = 1.5 + c.nose * 6.5, xF = 13.6, xR = -14.6;
  const yb1 = H.belt + c.chine * 2.2, yb2 = yb1 + 0.6;
  const zb = 12.15, zm = Math.min(14, zb + (yb1 - 0.9) * H.ks * (0.4 + c.flare * 1.2));
  const full = (x, yd) => ({ x, y0: 0.9, zb, yb1, yb2, zm, yd, zt: zm - (yd - yb2) * H.ku });
  const scaled = (b, x, s, yP) => ({
    x, y0: yP + s * (b.y0 - yP), zb: s * b.zb, yb1: yP + s * (b.yb1 - yP), yb2: yP + s * (b.yb2 - yP),
    zm: s * b.zm, yd: yP + s * (b.yd - yP), zt: s * b.zt,
  });
  const F = full(xF, H.deckF), R = full(xR, H.deckR);
  const st = [scaled(F, xF + nl * H.noseK, H.noseS, H.noseY), F];
  if (H.step) st.push(full(H.step[0], H.deckF), full(H.step[1], H.deckR));
  st.push(R, scaled(R, xR - H.tailL, H.tailS, H.tailY));
  st.ku = H.ku;
  return st;
}

// 8-point section, counter-clockwise from bottom-left: floor, right skirt, right LED band,
// right upper, deck, left upper, left band, left skirt
const sectionPts = s => [[-s.zb, s.y0], [s.zb, s.y0], [s.zm, s.yb1], [s.zm, s.yb2], [s.zt, s.yd], [-s.zt, s.yd], [-s.zm, s.yb2], [-s.zm, s.yb1]];
const HULL_KINDS = ['floor', 'skirt', 'band', 'upper', 'deck', 'upper', 'band', 'skirt'];

function sectionAt(st, x) {
  if (x > st[0].x || x < st[st.length - 1].x) return null;
  for (let i = 0; i < st.length - 1; i++) {
    const a = st[i], b = st[i + 1];
    if (x <= a.x && x >= b.x) {
      const t = a.x === b.x ? 0 : (a.x - x) / (a.x - b.x), o = { x };
      for (const k of ['y0', 'zb', 'yb1', 'yb2', 'zm', 'yd', 'zt']) o[k] = a[k] + (b[k] - a[k]) * t;
      return o;
    }
  }
  return null;
}
const deckAt = (st, x) => sectionAt(st, x)?.yd ?? -Infinity;
function hullTopAt(st, x, z) {
  const s = sectionAt(st, x); if (!s) return -Infinity;
  const az = Math.abs(z);
  if (az <= s.zt) return s.yd;
  if (az <= s.zm) return s.yd + (s.yb2 - s.yd) * (az - s.zt) / (s.zm - s.zt);
  return s.yb2;
}
function insidePoly(poly, z, y, tol = 0.05) {
  let area = 0;
  for (let i = 0; i < poly.length; i++) { const [z1, y1] = poly[i], [z2, y2] = poly[(i + 1) % poly.length]; area += z1 * y2 - z2 * y1; }
  if (Math.abs(area) < 1e-6) return false;
  const sg = Math.sign(area);
  for (let i = 0; i < poly.length; i++) {
    const [z1, y1] = poly[i], [z2, y2] = poly[(i + 1) % poly.length];
    const len = Math.hypot(z2 - z1, y2 - y1); if (len < 1e-9) continue;
    if (sg * ((z2 - z1) * (y - y1) - (y2 - y1) * (z - z1)) < -tol * len) return false;
  }
  return true;
}
function inside(st, p) {
  const s = sectionAt(st, p.x);
  return !!s && insidePoly(sectionPts(s), p.z, p.y);
}
// polygon stations [{x, pts}] sorted by x descending, linearly interpolated
function polyAt(sts, x) {
  if (!sts.length || x > sts[0].x || x < sts[sts.length - 1].x) return null;
  for (let i = 0; i < sts.length - 1; i++) {
    const a = sts[i], b = sts[i + 1];
    if (x <= a.x && x >= b.x) {
      const t = a.x === b.x ? 0 : (a.x - x) / (a.x - b.x);
      return a.pts.map((p, j) => [p[0] + (b.pts[j][0] - p[0]) * t, p[1] + (b.pts[j][1] - p[1]) * t]);
    }
  }
  return null;
}

/* ================= textures & materials ================= */

const texCache = new Map();
function canvasTex(key, w, h, draw, srgb = true) {
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);

}
const mix = (a, b, t) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString();
const glowTex = () => canvasTex('glow', 8, 256, (x, w, h) => {
  const g = x.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, '#fff'); g.addColorStop(0.06, '#fff'); g.addColorStop(0.2, '#bdbdbd');
  g.addColorStop(0.45, '#3c3c3c'); g.addColorStop(0.75, '#000'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, w, h);

const tintTex = led => canvasTex('tint' + led, 8, 256, (x, w, h) => {
  const g = x.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, mix(led, '#fff', 0.05)); g.addColorStop(0.22, mix(led, '#fff', 0.5));
  g.addColorStop(0.6, '#fff'); g.addColorStop(1, '#fff');

const radialTex = (key, stops) => canvasTex(key, 256, 256, (x, w, h) => {

const underTex = () => radialTex('under', [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,.55)'], [0.7, 'rgba(255,255,255,.12)'], [1, 'rgba(255,255,255,0)']]);
const shadowTex = () => radialTex('shadow', [[0, 'rgba(0,0,0,.7)'], [0.5, 'rgba(0,0,0,.35)'], [1, 'rgba(0,0,0,0)']]);
const floorTex = (inner, outer) => radialTex('floor' + inner, [[0, inner], [0.08, inner], [0.22, mix(inner, outer, 0.55)], [0.5, outer], [1, outer]]);

function makeMats(c) {
  const led = new THREE.Color(c.led);

  return {
    hull:   std('#f2f3f5', { roughness: 0.42, flatShading: true }),

    under:  std('#25282e', { flatShading: true }),
    barrel: std('#f6f7f9', { roughness: 0.3, metalness: 0.08 }),

    bore:   new THREE.MeshBasicMaterial({ color: '#0b0c0f' }),

    gauge:  std('#fafafa', { roughness: 0.3 }),
    ghost:  new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.4, transparent: true, opacity: 0.07, depthWrite: false, side: THREE.DoubleSide }),
    edge:   new THREE.LineBasicMaterial({ color: '#dfe3ea', transparent: true, opacity: 0.32 }),
    // x-ray internals
    alu:    std('#a3abb5', { metalness: 0.5, roughness: 0.4 }),
    steel:  std('#8f959e', { metalness: 0.6, roughness: 0.45 }),
    dark:   std('#30343b'),
    motor:  std('#7d858f', { metalness: 0.4 }),
    batt:   std('#3d434c'),
    comp:   std('#565c66', { metalness: 0.3 }),
    pcb:    std('#2e6b57'),
    tank:   std('#cfd4dc', { metalness: 0.5, roughness: 0.35 }),
    brass:  std('#c9a447', { metalness: 0.6, roughness: 0.35 }),
    air:    new THREE.MeshBasicMaterial({ color: '#79b8ff' }),

    frosted: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6, transparent: true, opacity: 0.45, depthWrite: false }),

/* ================= geometry helpers ================= */

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * Math.min(1, Math.max(0, t));
function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; }
const box = (w, h, d, mat, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z);
function cyl(r, len, axis, mat, x = 0, y = 0, z = 0, seg = 28, open = false) {
  const g = new THREE.CylinderGeometry(r, r, len, seg, 1, open);
  if (axis === 'x') g.rotateZ(-Math.PI / 2);
  if (axis === 'z') g.rotateX(Math.PI / 2);
  return mesh(g, mat, x, y, z);
}
function between(a, b, r, mat, seg = 16) {
  const d = V3().subVectors(b, a), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
  return m;
}
function airLine(points, M, r = 0.22) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => V3(...p)), false, 'centripetal');
  return new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 8, false), M.air);
}

// Loft polygon stations into one faceted mesh. Faces are grouped by the edge "kind" so
// each band of facets can get its own material. v runs 0 -> 1 from the lower to the upper
// end of each facet, so a bottom-bright texture lights the lower edge.
function loft(stations, kinds, caps = true) {
  const kindOf = typeof kinds === 'function' ? kinds : (s, e) => kinds[e % kinds.length];
  const buckets = new Map();
  const push = (kind, verts, uvs) => {
    if (!buckets.has(kind)) buckets.set(kind, { pos: [], uv: [] });
    const b = buckets.get(kind);
    verts.forEach(v => b.pos.push(v.x, v.y, v.z)); uvs.forEach(u => b.uv.push(u[0], u[1]));
  };
  const n = stations[0].pts.length;
  const centre = st => { let z = 0, y = 0; st.pts.forEach(p => { z += p[0]; y += p[1]; }); return V3(st.x, y / n, z / n); };
  const P = (st, i) => V3(st.x, st.pts[i][1], st.pts[i][0]);
  const tri = (kind, a, b, c, ua, ub, uc, ctr) => {
    const nrm = V3().subVectors(b, a).cross(V3().subVectors(c, a));
    if (nrm.lengthSq() < 1e-10) return;
    const mid = V3().add(a).add(b).add(c).divideScalar(3).sub(ctr);
    if (nrm.dot(mid) < 0) push(kind, [a, c, b], [ua, uc, ub]); else push(kind, [a, b, c], [ua, ub, uc]);
  };
  for (let s = 0; s < stations.length - 1; s++) {
    const A = stations[s], B = stations[s + 1], ctr = centre(A).add(centre(B)).multiplyScalar(0.5);
    const u0 = s / (stations.length - 1), u1 = (s + 1) / (stations.length - 1);
    for (let e = 0; e < n; e++) {
      const f = (e + 1) % n, kind = kindOf(s, e);
      const ve = A.pts[e][1] <= A.pts[f][1] ? 0 : 1, vf = 1 - ve;
      const a0 = P(A, e), a1 = P(A, f), b1 = P(B, f), b0 = P(B, e);
      tri(kind, a0, a1, b1, [u0, ve], [u0, vf], [u1, vf], ctr);
      tri(kind, a0, b1, b0, [u0, ve], [u1, vf], [u1, ve], ctr);
    }
  }
  const ends = caps ? [stations[0], stations[stations.length - 1]] : [];
  ends.forEach((st, i) => {
    const c = centre(st), other = ends[1 - i];
    const out = V3(Math.sign(st.x - other.x) || 1, 0, 0);
    for (let e = 0; e < n; e++) {
      const a = P(st, e), b = P(st, (e + 1) % n);
      const nrm = V3().subVectors(a, c).cross(V3().subVectors(b, c));
      if (nrm.lengthSq() < 1e-10) continue;
      if (nrm.dot(out) < 0) push('cap', [c, b, a], [[0.5, 0.5], [0, 0], [1, 1]]);
      else push('cap', [c, a, b], [[0.5, 0.5], [1, 1], [0, 0]]);
    }
  });
  const geo = new THREE.BufferGeometry(), pos = [], uv = [], order = [];
  let start = 0;
  for (const [kind, b] of buckets) {
    pos.push(...b.pos); uv.push(...b.uv);
    const count = b.pos.length / 3;
    geo.addGroup(start, count, order.length); order.push(kind);
    start += count;
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.computeVertexNormals();
  return { geo, order };
}
function loftMesh(stations, kinds, matFor, M, xray, caps = true) {
  const { geo, order } = loft(stations, kinds, caps);
  const m = new THREE.Mesh(geo, order.map(k => { const mat = matFor(k); return xray && mat !== M.led ? M.ghost : mat; }));
  if (!xray) return m;
  const g = new THREE.Group(); g.add(m);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 12), M.edge));
  return g;
}

/* ================= wheels ================= */

function buildWheel(M, hand) {
  const R = PK.wheelR, Wd = PK.wheelW, g = new THREE.Group();
  const disc = new THREE.CylinderGeometry(R * 0.8, R * 0.8, 0.3, 32); disc.rotateX(Math.PI / 2);
  for (const z of [-Wd / 2, Wd / 2]) g.add(mesh(disc, M.hull, 0, 0, z));
  const rg = new THREE.CapsuleGeometry(0.58, Wd * 1.05 - 1.16, 3, 8);
  for (let i = 0; i < 10; i++) {
    const th = (i / 10) * Math.PI * 2;
    const r = mesh(rg, M.roller, (R - 0.58) * Math.cos(th), (R - 0.58) * Math.sin(th), 0);
    r.quaternion.setFromUnitVectors(V3(0, 1, 0), V3(-Math.sin(th), Math.cos(th), hand).normalize());
    g.add(r);
  }
  return g;
}

/* ================= gun ================= */

// Gun contents in gun-local coords: origin on the trunnion axis, barrels along +x.
// Stacked barrels sit on the centreline; each chamber runs sideways into a turret half
// (alternating sides). The revolver has one barrel, one chamber and an exposed drum.
function gunLayout(c) {
  const n = barrelCount(c.layout), G = { barrels: [], qevs: [] };
  if (c.layout === 'revolver') {
    const N = c.drumN, rc = (PK.shirtR + 0.2) / Math.sin(Math.PI / N), R = rc + PK.shirtR + 0.35;
    G.drum = { rc, R, N, x0: 0.6, x1: 9.6 };
    G.qevs.push({ x: -1.6, y: rc, side: -1 });
    G.barrels.push({ x0: 10.4, y: rc });
    G.sw = R + 0.7;
    G.block = { x0: -3.8, x1: 0.6, yB: -1.6, yT: rc + 2.3 };
    G.corners = [[-3.8, -1.6], [-3.8, rc + 2.3], [0.6, -R], [9.6, -R], [9.6, R], [10.4, -1.2], [10.4, rc + 1.9], [-1, R + 0.65], [10.4, R + 0.65]];
  } else {
    for (let k = 0; k < n; k++) {
      const y = (k - (n - 1) / 2) * PK.pitch;
      G.qevs.push({ x: 0, y, side: k % 2 ? 1 : -1 });
      G.barrels.push({ x0: PK.qev[0] / 2, y });
    }
    G.sw = 2.0;
    G.coreTop = (n - 1) / 2 * PK.pitch + 2.0;
    const t = G.coreTop;
    G.corners = [[-2.6, -t * 0.9], [-2.6, t * 0.9], [2.6, -t], [2.6, t], [4.8, -t * 0.85], [4.8, t * 0.85]];
  }
  // sample points of the parts that live in the turret halves (fit check + clearance radius)
  G.parts = [];
  for (const q of G.qevs) {
    const ring = z => Array.from({ length: 10 }, (_, i) => { const a = (i / 10) * Math.PI * 2; return V3(q.x + PK.chR * Math.cos(a), q.y + PK.chR * Math.sin(a), z); });
    G.parts.push({ name: 'Chamber', pts: [...ring(q.side * 1.4), ...ring(q.side * (1.4 + PK.chLen))] });
    const v = [];
    for (const dx of [-0.75, 0.75]) for (const dy of [-0.75, 0.75]) for (const dz of [-0.75, 0.75]) v.push(V3(q.x + 0.3 + dx, q.y + 0.5 + dy, -q.side * 2.3 + dz));
    v.push(V3(q.x + 0.3, q.y - 0.4, -q.side * 5.1));
    G.parts.push({ name: 'Valves', pts: v });
  }
  let r = 0;
  for (const p of G.parts) for (const v of p.pts) r = Math.max(r, Math.hypot(v.x, v.y));
  for (const q of G.qevs) r = Math.max(r, Math.hypot(Math.abs(q.x) + 1.7, Math.abs(q.y) + 1.5));
  G.Rint = r + 0.3;
  G.top0 = Math.max(...G.corners.map(p => p[1]));
  return G;
}

const octPts = (w, yT, yB, ch) => {
  ch = Math.max(0.05, Math.min(ch, (yT - yB) / 2 - 0.05, w - 0.05));
  return [[-w + ch, yB], [w - ch, yB], [w, yB + ch], [w, yT - ch], [w - ch, yT], [-w + ch, yT], [-w, yT - ch], [-w, yB + ch]];
};

// The elevating part: barrels plus either a slim faceted core (stacks) or the revolver
// breech, exposed drum, front post and top strap.
function buildGun(c, M, G) {
  const g = new THREE.Group(), xray = c.xray;
  let collarX;
  if (!G.drum) {
    const cw = G.sw - 0.25, t = G.coreTop;
    g.add(loftMesh([
      { x: 4.8, pts: octPts(cw * 0.85, t * 0.85, -t * 0.85, 0.5) },
      { x: 2.6, pts: octPts(cw, t, -t, 0.6) },
      { x: -2.6, pts: octPts(cw * 0.9, t * 0.9, -t * 0.9, 0.6) },
    ], ['core'], () => M.hull, M, xray));
    collarX = 5.0;
    // trunnion plates close the chamber openings in the slot walls
    for (const sgn of [-1, 1]) {
      const plate = cyl(G.Rint * 0.92, 0.12, 'z', M.collar, 0, 0, sgn * (G.sw - 0.08), 8);
      plate.rotation.z = Math.PI / 8;
      g.add(plate);
      if (c.rings) {
        const ring = mesh(new THREE.RingGeometry(G.Rint * 0.92 - 0.3, G.Rint * 0.92 - 0.05, 8), M.led, 0, 0, sgn * (G.sw - 0.16));
        ring.rotation.z = Math.PI / 8;
        g.add(ring);
      }
    }
  } else {
    const d = G.drum, b = G.block, dl = d.x1 - d.x0, bw = G.sw - 0.4;
    g.add(loftMesh([
      { x: b.x1, pts: octPts(bw, b.yT, b.yB, 1.0) },
      { x: -1.6, pts: octPts(bw, b.yT, b.yB, 1.0) },
      { x: b.x0, pts: octPts(bw * 0.92, b.yT - 0.3, b.yB + 0.3, 1.0) },
    ], ['core'], () => M.hull, M, xray));
    const dg = new THREE.Group(); dg.position.x = (d.x0 + d.x1) / 2;
    for (const sx of [-1, 1]) dg.add(cyl(d.R, 0.5, 'x', M.hull, sx * (dl / 2 - 0.25), 0, 0, 40));
    const hole = new THREE.CircleGeometry(PK.shirtR + 0.1, 24); hole.rotateY(Math.PI / 2);
    for (let i = 0; i < d.N; i++) {
      const a = (i / d.N) * Math.PI * 2, y = d.rc * Math.cos(a), z = d.rc * Math.sin(a);
      dg.add(cyl(PK.shirtR + 0.12, dl - 1, 'x', M.frosted, 0, y, z, 24, true));
      dg.add(mesh(hole, M.bore, dl / 2 + 0.01, y, z));
      if (i) {
        dg.add(cyl(PK.shirtR - 0.3, dl - 1.6, 'x', M.shirt, 0, y, z, 20));
        const face = new THREE.CircleGeometry(PK.shirtR - 0.3, 20); face.rotateY(Math.PI / 2);
        dg.add(mesh(face, M.shirt, dl / 2 + 0.03, y, z));
      }
    }
    if (c.rings) dg.add(cyl(d.R + 0.04, 0.3, 'x', M.led, dl / 2 - 0.25, 0, 0, 48, true));
    dg.add(cyl(0.6, dl + 1.6, 'x', M.collar, 0, 0, 0, 16));
    g.add(dg);
    g.add(box(0.8, d.rc + 3.1, 3.8, M.hull, d.x1 + 0.4, (d.rc + 1.9 - 1.2) / 2, 0));         // front post
    g.add(box(d.x1 + 1.8, 0.6, 2.0, M.hull, (d.x1 - 0.2) / 2, d.R + 0.35, 0));             // top strap
    g.add(box(3, 2.2, 2.0, M.motor, d.x0 + 2, -d.R * 0.45, d.R * 0.72));                     // index motor
    for (const sgn of [-1, 1]) g.add(cyl(1.1, 0.8, 'z', M.collar, 0, 0, sgn * (G.sw - 0.2), 20));
    collarX = d.x1 + 0.95;
  }
  for (const b of G.barrels) {
    const len = c.barrelLen, x1 = b.x0 + len;
    g.add(cyl(PK.barrelR, len, 'x', M.barrel, b.x0 + len / 2, b.y, 0, 32));
    const bore = new THREE.CircleGeometry(PK.barrelR - 0.18, 28); bore.rotateY(Math.PI / 2);
    g.add(mesh(bore, M.bore, x1 + 0.01, b.y, 0));
    if (c.rings) g.add(cyl(PK.barrelR + 0.05, 0.7, 'x', M.led, x1 - 0.9, b.y, 0, 32, true));
    if (!xray) g.add(cyl(PK.barrelR + 0.32, 0.6, 'x', M.collar, collarX, b.y, 0, 28));
  }
  if (!xray) return g;
  for (const q of G.qevs) {
    g.add(box(...PK.qev, M.dark, q.x, q.y, 0));
    g.add(cyl(PK.chR, PK.chLen - 0.8, 'z', M.steel, q.x, q.y, q.side * (1.4 + PK.chLen / 2)));
    g.add(cyl(PK.chR + 0.25, 0.8, 'z', M.steel, q.x, q.y, q.side * (1.4 + PK.chLen - 0.4)));
    g.add(box(1.5, 1.5, 1.5, M.brass, q.x + 0.3, q.y + 0.5, -q.side * 2.3));
    g.add(cyl(0.45, 2.2, 'z', M.brass, q.x + 0.3, q.y - 0.4, -q.side * 4.0));
    g.add(airLine([[q.x + 0.3, q.y - 0.4, -q.side * 5.1], [q.x - 0.8, q.y - 0.6, -q.side * 5.8], [-0.4, 0, G.sw + 0.4]], M, 0.18));
  }
  return g;
}

// Fixed turret halves: the hull's upper side panels carry straight on up (same plane) and
// wrap around the gun, leaving a centre slot for it to elevate through. Front and rear are
// single sloped glacis panels down to the deck.
const WRAP = {
  slab:  { gf: 2.2, gr: 1.6, ch: 1.0 },
  wedge: { gf: 7.0, gr: 1.2, ch: 1.4 },
  hex:   { gf: 3.2, gr: 3.2, ch: 2.6 },
  arrow: { gf: 5.5, gr: 1.6, ch: 1.0, narrow: true },
};
const WRAP_KINDS = ['wfloor', 'wside', 'wside', 'wtop', 'wled', 'wwall'];
function wrapStations(c, st, xp, yT, G) {
  const W = WRAP[c.pod], sw = G.sw, Rw = G.Rint + 0.6, ku = st.ku;
  const xFront = st[1].x - 0.3, xBack = st[st.length - 2].x + 0.3;
  const xf1 = Math.min(xp + Rw, xFront - 0.6), xr1 = Math.max(xp - Rw, xBack + 0.6);
  const xf0 = Math.min(xf1 + W.gf, xFront), xr0 = Math.max(xr1 - W.gr, xBack);
  const top = x => x > xf1 ? lerp(yT, deckAt(st, xf0), (x - xf1) / (xf0 - xf1))
                 : x < xr1 ? lerp(yT, deckAt(st, xr0), (xr1 - x) / (xr1 - xr0)) : yT;
  const sec = x => {
    const s = sectionAt(st, x), tp = top(x);
    const zo = y => s.zm - (y - s.yb2) * ku;
    if (tp <= s.yd + 0.05) {
      const zf = W.narrow && x > xp ? sw + 1.5 : s.zt;
      return { x, pts: [[sw, s.yd], [zf, s.yd], [zf, s.yd], [zf, s.yd], [sw, s.yd], [sw, s.yd]] };
    }
    const ch = Math.min(W.ch, (tp - s.yd) * 0.45), zA = Math.max(sw + 0.6, zo(tp - ch));
    return { x, pts: [[sw, s.yd], [s.zt, s.yd], [zA, tp - ch], [Math.max(sw + 0.3, zA - ch), tp], [sw, tp], [sw, tp - Math.min(0.55, tp - s.yd)]] };
  };
  const xs = [xf0, xf1, xr1, xr0, ...st.map(s => s.x).filter(x => x < xf0 && x > xr0)];
  return [...new Set(xs.map(x => +x.toFixed(4)))].sort((a, b) => b - a).map(sec);
}

/* ================= full robot ================= */

function buildRobot(cfg) {
  const c = { ...BASE, ...cfg };
  const M = makeMats(c), xray = c.xray;
  const g = new THREE.Group();
  const st = hullStations(c);
  const xp = PIVOT_X[c.hull];

  // hull (nose/tail underside faces read as a lower glacis, not as floor)
  const matFor = k => k === 'floor' ? M.under : k === 'skirt' ? (c.skirtGlow ? M.glow : M.hull) : k === 'band' ? (c.band ? M.led : M.hull) : M.hull;
  const kinds = (s, e) => e === 0 && (st[s].y0 > 1.2 || st[s + 1].y0 > 1.2) ? 'chin' : HULL_KINDS[e];
  g.add(loftMesh(st.map(s => ({ x: s.x, pts: sectionPts(s) })), kinds, matFor, M, xray));

  for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const w = buildWheel(M, sx * sz);
    w.position.set(sx * PK.axleX, PK.wheelR, sz * PK.wheelZ);
    if (sz < 0) w.rotation.y = Math.PI;
    g.add(w);
  }

  // trunnion height: chamber orbit clears the deck, gun clears the deck through 0-90 deg,
  // barrels clear the nose at 0 deg
  const G = gunLayout(c);
  let yp = 0;
  for (let x = xp - G.Rint; x <= xp + G.Rint + 1e-6; x += 0.5) yp = Math.max(yp, deckAt(st, x) + G.Rint + 0.5);
  for (let a = 0; a <= 90; a += 5) {
    const r = THREE.MathUtils.degToRad(a), co = Math.cos(r), si = Math.sin(r);
    for (const [px, py] of G.corners) yp = Math.max(yp, deckAt(st, xp + px * co - py * si) + 0.6 - (px * si + py * co));
  }
  const low = Math.min(...G.barrels.map(b => b.y)) - PK.barrelR;
  for (let t = 0; t <= 1.0001; t += 0.05) yp = Math.max(yp, deckAt(st, xp + G.barrels[0].x0 + t * c.barrelLen) + 0.5 - low);
  const yT = yp + G.Rint + 0.6;

  const gun = buildGun(c, M, G);
  gun.position.set(xp, yp, 0);
  gun.rotation.z = THREE.MathUtils.degToRad(c.elev);
  g.add(gun);

  const wrapR = wrapStations(c, st, xp, yT, G);
  const wrapMat = k => k === 'wled' ? (c.podBand ? M.led : M.hull) : k === 'wfloor' ? M.under : M.hull;
  for (const sgn of [1, -1]) g.add(loftMesh(wrapR.map(s => ({ x: s.x, pts: s.pts.map(([z, y]) => [sgn * z, y]) })), WRAP_KINDS, wrapMat, M, xray));
  if (c.rings) {
    const s = sectionAt(st, xp);
    if (s) for (const sgn of [-1, 1]) {
      const z = s.zm - (yp - s.yb2) * st.ku, n = V3(0, st.ku, sgn).normalize();
      const ring = mesh(new THREE.RingGeometry(1.25, 1.65, 8), M.led, xp, yp + n.y * 0.04, sgn * z + n.z * 0.04);
      ring.quaternion.setFromUnitVectors(V3(0, 0, 1), n);
      g.add(ring);
    }
  }

  // exterior details: rear service panel (gauges, E-stop, bleed), intake grilles, nose camera
  const px0 = st[st.length - 2].x + 1.8, py0 = deckAt(st, px0);
  if (Number.isFinite(py0)) {
    const panel = new THREE.Group(); panel.position.set(px0, py0, 0);
    panel.add(box(3.2, 0.3, 7.4, xray ? M.ghost : M.hull, 0, 0.15, 0));
    for (const z of [-2.4, -0.4]) {
      panel.add(cyl(0.95, 0.35, 'y', M.collar, 0, 0.45, z, 24));
      panel.add(cyl(0.8, 0.37, 'y', M.gauge, 0, 0.46, z, 24));
      const needle = box(0.07, 0.04, 0.65, M.estop, 0.15, 0.66, z + 0.2); needle.rotation.y = 0.8; panel.add(needle);
    }
    panel.add(cyl(0.55, 0.7, 'y', M.collar, 0, 0.6, 1.6, 20));
    panel.add(mesh(new THREE.SphereGeometry(0.85, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), M.estop, 0, 0.95, 1.6));
    panel.add(box(1.4, 0.25, 0.35, M.estop, -0.2, 0.5, 3.1));
    g.add(panel);
  }
  for (const sgn of [-1, 1]) {
    const x = 3, s = sectionAt(st, x);
    if (!s) continue;
    const t = 0.42, z = s.zm + (s.zt - s.zm) * t, y = s.yb2 + (s.yd - s.yb2) * t;
    const n = V3(0, st.ku, 1).normalize();
    const grille = new THREE.Group();
    grille.position.set(x, y + n.y * 0.04, sgn * (z + n.z * 0.04));
    grille.quaternion.setFromUnitVectors(V3(0, 0, 1), V3(0, n.y, sgn * n.z));
    for (let i = 0; i < 4; i++) grille.add(box(4.6, 0.2, 0.06, M.collar, 0, (i - 1.5) * 0.42, 0));
    g.add(grille);
  }
  const nx = st[1].x - 0.9, ny = deckAt(st, nx);
  if (Number.isFinite(ny)) {
    g.add(box(1.4, 0.8, 2.0, xray ? M.ghost : M.hull, nx, ny + 0.4, 0));
    g.add(box(0.06, 0.5, 1.3, M.glass, nx + 0.72, ny + 0.45, 0));
  }
  if (c.underglow) for (const sgn of [-1, 1]) g.add(box(st[1].x - st[st.length - 2].x - 1, 0.18, 0.18, M.led, (st[1].x + st[st.length - 2].x) / 2, 1.0, sgn * (st[1].zb - 0.05)));

  // fit check: hull internals, plus chambers/valves through the whole elevation range
  const parts = internals(c, M, st, xp, yp, G, gun);
  const fails = [];
  for (const p of parts) {
    const ok = p.pts.every(q => inside(st, q));
    if (!ok) fails.push(p.name);
    if (xray && p.mesh) { if (!ok) p.mesh.traverse(n => { if (n.isMesh) n.material = M.fail; }); g.add(p.mesh); }
    else if (p.mesh) p.mesh.traverse(n => n.geometry?.dispose());
  }
  const inWrap = p => { const poly = polyAt(wrapR, p.x); return !!poly && insidePoly(poly, Math.abs(p.z), p.y); };
  for (const part of G.parts) {
    const ok = [0, 30, 60, 90, c.elev].every(a => {
      const r = THREE.MathUtils.degToRad(a);
      return part.pts.every(q => {
        const p = q.clone().applyAxisAngle(V3(0, 0, 1), r).add(V3(xp, yp, 0));
        return Math.abs(p.z) <= G.sw + 0.05 || inWrap(p) || inside(st, p);
      });
    });
    if (!ok) fails.push(part.name);
  }

  const hullW = 2 * Math.max(...st.map(s => s.zm));
  g.userData = {
    led: c.led, underglow: c.underglow, glow: c.glow,
    overallL: st[0].x - st[st.length - 1].x, overallW: hullW, height: Math.max(yT, yp + G.top0),
    footL: st[0].x - st[st.length - 1].x, footW: hullW, fails,
    air: G.drum ? `1 chamber, ${G.drum.N}-shot drum` : `${G.qevs.length} × 0.94 L chamber${G.qevs.length > 1 ? 's' : ''}`,
  };
  return g;
}

// Internal systems. Each part returns sample points for the fit check and (in x-ray) a mesh.
function internals(c, M, st, xp, yp, G, gun) {
  const parts = [];
  const boxPts = (x0, y0, z0, x1, y1, z1) => { const p = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) p.push(V3(x, y, z)); return p; };
  const addBox = (name, x0, y0, z0, x1, y1, z1, mat) => parts.push({ name, pts: boxPts(x0, y0, z0, x1, y1, z1), mesh: box(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2) });
  const ring = (axis, cx, cy, cz, r, n = 10) => Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2, u = r * Math.cos(a), v = r * Math.sin(a);
    return axis === 'z' ? V3(cx + u, cy + v, cz) : axis === 'x' ? V3(cx, cy + u, cz + v) : V3(cx + u, cy, cz + v);
  });

  // drive: Toughbox Mini + CIM at each corner, frame rails, belly pan
  const frame = new THREE.Group();
  for (const sz of [-1, 1]) frame.add(box(27.5, 1, 1, M.alu, -0.4, 1.7, sz * 8.6));
  for (const x of [13.2, -14.0, 0]) frame.add(box(1, 1, 18.2, M.alu, x, 1.7, 0));
  frame.add(box(27, 0.12, 16.2, M.dark, -0.4, 2.24, 0));
  parts.push({ name: 'Frame', pts: boxPts(-14.5, 1.2, -9.1, 13.7, 2.3, 9.1), mesh: frame });
  for (const sx of [1, -1]) for (const sz of [1, -1]) {
    const ax = sx * PK.axleX;
    addBox('Gearbox', ax - 1.75, 2.6, sz * 6.7, ax + 1.75, 7.0, sz * 9.3, M.motor);
    const cx = ax - sx * 1.6, z0 = sz * 2.4, z1 = sz * 6.7;
    parts.push({ name: 'CIM', pts: [...ring('z', cx, 5.8, z0, 1.25), ...ring('z', cx, 5.8, z1, 1.25)], mesh: cyl(1.25, 4.3, 'z', M.motor, cx, 5.8, (z0 + z1) / 2) });
  }
  // power + air supply
  addBox('Battery', -1, 2.3, -8.2, 6.1, 8.9, -5.2, M.batt);
  const comp = new THREE.Group();
  comp.add(box(9.6, 4.6, 5, M.comp, 1.8, 4.6, 5.5));
  comp.add(cyl(1.7, 2.6, 'y', M.alu, 4.4, 8.1, 5.5, 20));
  parts.push({ name: 'Compressor', pts: boxPts(-3, 2.3, 3, 6.6, 9.4, 8), mesh: comp });
  addBox('Electronics', -2.5, 2.3, -3.2, 6, 3.9, 3.2, M.pcb);
  const T = PK.tank, half = T.len / 2 - T.r;
  const tank = new THREE.Group();
  const cap = new THREE.CapsuleGeometry(T.r, T.len - 2 * T.r, 8, 24); cap.rotateX(Math.PI / 2);
  tank.add(mesh(cap, M.tank, T.x, T.y, 0));
  for (const z of [-5, 5]) tank.add(box(5, 1.2, 1.4, M.dark, T.x, T.y - T.r - 0.2, z));
  parts.push({ name: 'Air tank', pts: [...ring('z', T.x, T.y, -half, T.r), ...ring('z', T.x, T.y, half, T.r), V3(T.x, T.y, -T.len / 2), V3(T.x, T.y, T.len / 2)], mesh: tank });
  const man = new THREE.Group();
  man.add(box(3, 1.4, 1.6, M.brass, -6.4, 10.2, 3.6));
  man.add(box(1.4, 1.4, 1.4, M.brass, -6.4, 10.2, 1.8));
  man.add(cyl(0.35, 1.0, 'y', M.steel, -5.6, 11.2, 3.6, 12));
  parts.push({ name: 'Manifold', pts: boxPts(-7.9, 9.5, 1.1, -4.9, 11.7, 4.4), mesh: man });
  addBox('Horn speaker', 10.6, 4.4, -2.1, 13.0, 8.2, 2.1, M.dark);

  // air path: compressor -> tank -> fill valve/manifold -> up through the trunnion
  if (c.xray) {
    const air = new THREE.Group();
    air.add(airLine([[4.4, 9.4, 5.5], [0, 11.0, 6.6], [-6.5, 11.0, 6.8], [-9.6, T.y + 1.5, 6.2]], M));
    air.add(airLine([[-9.4, T.y + 1.8, 2.4], [-7.8, 10.8, 2.4], [-6.4, 10.2, 1.8]], M));
    const hz = G.sw + 0.4;
    air.add(airLine([[-4.9, 10.2, 3.6], [xp - 3, deckAt(st, xp - 3) - 0.8, Math.max(hz, 5)], [xp - 0.5, yp - 2.5, hz], [xp, yp, hz]], M));
    parts.push({ name: 'Air lines', pts: [], mesh: air });
  }

  // elevation actuator: floor pivot to a lug under the gun
  const lug = (G.drum ? V3(-0.8, G.block.yB + 0.4, 0) : V3(2.4, -G.coreTop + 0.6, 0)).applyAxisAngle(V3(0, 0, 1), gun.rotation.z).add(gun.position);
  const base = V3(xp + 6.8, 4.6, 0), dir = V3().subVectors(lug, base), u = dir.clone().normalize();
  const act = new THREE.Group(), bodyLen = Math.min(8.5, dir.length() - 0.6);
  act.add(between(base, base.clone().addScaledVector(u, bodyLen), 0.95, M.dark));
  act.add(between(base.clone().addScaledVector(u, bodyLen - 0.4), lug, 0.45, M.alu));
  parts.push({ name: 'Actuator', pts: [base], mesh: act });
  return parts;
}

function disposeTree(o) {
  o.traverse(n => {
    if (n.geometry) n.geometry.dispose();
    if (n.material) (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => m.dispose());
  });
}
const build = buildRobot;

/* ================= stage ================= */

function makeStage() {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#3a3d44', 1.25));
  const key = new THREE.DirectionalLight('#ffffff', 2.4); key.position.set(30, 80, 45); scene.add(key);
  const rim = new THREE.DirectionalLight('#dfe6ff', 0.9); rim.position.set(-50, 25, -40); scene.add(rim);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(600, 72), new THREE.MeshBasicMaterial());
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex(), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; scene.add(shadow);
  const under = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: underTex(), transparent: true, depthWrite: false, toneMapped: false }));
  under.rotation.x = -Math.PI / 2; under.position.y = 0.04; scene.add(under);
  let robot = null, backdrop = null;
  function setBackdrop(kind) {
    if (kind === backdrop) return;
    backdrop = kind;
    const [inner, outer] = kind === 'light' ? ['#f4f5f7', '#d4d7dc'] : ['#2a2d34', '#111317'];
    floor.material.map = floorTex(inner, outer); floor.material.needsUpdate = true;
    scene.background = new THREE.Color(outer);
    scene.fog = new THREE.Fog(outer, 180, 420);
  }
  function setRobot(r, cfg) {
    if (robot) { scene.remove(robot); disposeTree(robot); }
    robot = r; scene.add(r);
    setBackdrop(cfg.backdrop);
    const { footL, footW, led, underglow, glow } = r.userData;
    shadow.scale.set(footL * 1.4, footW * 1.6, 1);
    under.visible = underglow && glow > 0;
    under.scale.set(footL * 1.5, footW * 1.7, 1);
    under.material.color.set(led);
    const dark = cfg.backdrop !== 'light';
    under.material.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
    under.material.opacity = (dark ? 0.8 : 0.32) * Math.min(glow, 1.3) * (cfg.xray ? 0.5 : 1);
    under.material.needsUpdate = true;
  }
  return { scene, setRobot, get robot() { return robot; } };
}

// Exact perspective fit of the robot's sampled vertices from a fixed 3/4 front view.
function frame(camera, robot, controls, margin = 0.9) {
  robot.updateMatrixWorld(true);
  const pts = [];
  robot.traverse(n => {
    if (!n.isMesh) return;
    const pos = n.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 200));
    for (let i = 0; i < pos.count; i += step) pts.push(V3().fromBufferAttribute(pos, i).applyMatrix4(n.matrixWorld));
  });
  const b = new THREE.Box3().setFromPoints(pts);
  const dir = V3(1, 0.42, 0.85).normalize(), fwd = dir.clone().negate();
  const right = V3().crossVectors(fwd, V3(0, 1, 0)).normalize(), up = V3().crossVectors(right, fwd);
  const c0 = b.getCenter(V3());
  const xs = pts.map(p => p.clone().sub(c0).dot(right)), ys = pts.map(p => p.clone().sub(c0).dot(up));
  const target = c0.clone()
    .addScaledVector(right, (Math.min(...xs) + Math.max(...xs)) / 2)
    .addScaledVector(up, (Math.min(...ys) + Math.max(...ys)) / 2);
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), tanH = tanV * camera.aspect;
  let dist = 0;
  for (const p of pts) {
    const rel = p.clone().sub(target), a = rel.dot(dir);
    dist = Math.max(dist, a + Math.abs(rel.dot(right)) / (margin * tanH), a + Math.abs(rel.dot(up)) / (margin * tanV));
  }
  camera.position.copy(target).addScaledVector(dir, dist);
  camera.near = dist / 50; camera.far = dist * 20; camera.updateProjectionMatrix();
  camera.lookAt(target);
  if (controls) { controls.target.copy(target); controls.update(); }
}

function makeRenderer(opts = {}) {
  const r = new THREE.WebGLRenderer({ antialias: true, ...opts });
  r.toneMapping = THREE.NeutralToneMapping;
  return r;
}

const shot = (() => {
  const renderer = makeRenderer({ preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  const stage = makeStage();
  const camera = new THREE.PerspectiveCamera(30, 1.5, 0.1, 2000);
  return (cfg, w = 900, h = 600, type = 'image/jpeg') => {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const r = build(cfg);
    stage.setRobot(r, cfg);
    frame(camera, r);
    renderer.render(stage.scene, camera);
    return { url: renderer.domElement.toDataURL(type, 0.9), info: r.userData };
  };
})();

const STORE = 'mk5-concepts-v2';
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE)) || { edits: {}, custom: [] }; }
  catch { return { edits: {}, custom: [] }; }
}
function saveStore() { try { localStorage.setItem(STORE, JSON.stringify(store)); } catch {} }
const store = loadStore();
store.edits ||= {}; store.custom ||= [];
const designs = () => [
  ...PRESETS.map(p => ({ ...BASE, ...p, ...(store.edits[p.id] || {}) })),
  ...store.custom.map(c => ({ ...BASE, ...c })),
];

/* ================= grid ================= */

const gridEl = document.getElementById('grid');
const cards = new Map();
let gridX = false;
function renderGrid() {
  gridEl.innerHTML = ''; cards.clear();
  const all = designs();
  for (const cat of [...Object.keys(LAYOUTS), 'yours']) {
    const items = all.filter(d => (store.custom.some(c => c.id === d.id) ? 'yours' : d.layout) === cat);
    if (!items.length) continue;
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${cat === 'yours' ? 'Yours' : LAYOUTS[cat]}${LAYOUT_NOTE[cat] ? ` <span>${LAYOUT_NOTE[cat]}</span>` : ''}</h2><div class="grid"></div>`;
    for (const d of items) {
      const b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = `<div class="thumb"><img alt=""></div><div class="meta"><div class="n"></div><div class="d"></div></div>`;
      b.addEventListener('click', () => openViewer(d.id));
      sec.querySelector('.grid').appendChild(b);
      cards.set(d.id, b);
      fillCard(b, d);
    }
    gridEl.appendChild(sec);
  }
  queueThumbs(all.map(d => d.id));
}
function fillCard(b, d, info) {
  const fit = info ? (info.fails.length ? `<i class="bad">✗ ${info.fails[0]}</i>` : '<i class="ok">✓ fits</i>') : '';
  b.querySelector('.n').innerHTML = `${escapeHtml(d.name)}${fit}`;
  b.querySelector('.d').textContent = `${HULLS[d.hull]} · ${PODS[d.pod]} turret${info ? ` · ${info.overallW.toFixed(1)} in wide` : ''}`;
  b.querySelector('img').alt = `${d.name} concept render`;
}
const escapeHtml = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

let thumbQueue = [], thumbBusy = false;
function queueThumbs(ids) {
  thumbQueue.push(...ids.filter(id => !thumbQueue.includes(id)));
  if (!thumbBusy) pumpThumbs();
}
function pumpThumbs() {
  const id = thumbQueue.shift();
  if (!id) { thumbBusy = false; document.body.dataset.thumbs = 'done'; return; }
  thumbBusy = true; document.body.dataset.thumbs = 'busy';
  const d = designs().find(x => x.id === id), card = cards.get(id);
  if (d && card) {
    const img = card.querySelector('img');
    const { url, info } = shot({ ...d, xray: gridX });
    img.onload = () => { img.classList.add('on'); card.querySelector('.thumb').classList.add('ready'); };
    img.src = url;
    fillCard(card, d, info);
  }
  setTimeout(pumpThumbs, 0);
}
document.getElementById('gridMode').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  gridX = b.dataset.mode === 'xray';
  document.querySelectorAll('#gridMode .chip').forEach(x => x.classList.toggle('on', x === b));
  queueThumbs(designs().map(d => d.id));
});

function rebuild(reframe = false) {
  const r = build(cur);
  vStage.setRobot(r, cur);
  if (reframe) frame(vCam, r, controls);
  const u = r.userData;
  const fit = u.fails.length ? `<span class="bad">Fit <b>✗ ${[...new Set(u.fails)].join(', ')}</b></span>` : `<span class="ok">Fit <b>✓ all systems</b></span>`;
  const door = u.overallW <= 30 ? `<span class="ok">Door <b>✓ 32 in</b></span>` : `<span class="bad">Door <b>✗</b></span>`;
  let html = `<span>Footprint <b>${u.overallL.toFixed(1)} × ${u.overallW.toFixed(1)} in</b></span><span>Height <b>${u.height.toFixed(1)} in</b></span>${door}${fit}<span>Air <b>${u.air} · 2.5 gal tank</b></span>`;
  if (cur.xray) {
    const key = [['Tank', '#cfd4dc'], ['Chambers', '#8f959e'], ['QEV', '#30343b'], ['Valves', '#c9a447'], ['Air', '#79b8ff'], ['Battery', '#3d434c'], ['Compressor', '#565c66'], ['Electronics', '#2e6b57'], ['Drive', '#7d858f']];
    html += key.map(([k, col]) => `<span><i style="background:${col}"></i>${k}</span>`).join('');
  }
  document.getElementById('readout').innerHTML = html;
  document.getElementById('vtitle').innerHTML = `${escapeHtml(cur.name)}<span>${LAYOUTS[cur.layout]}</span>`;
  document.getElementById('xray').classList.toggle('on', !!cur.xray);
  draw();
}

function openViewer(id, xray = false) {
  const d = designs().find(x => x.id === id);
  if (!d) return;
  curId = id; cur = { ...d, xray };
  viewer.hidden = false;
  document.body.style.overflow = 'hidden';
  buildPanel(); resize(); rebuild(true);
}
function refreshCard() {
  if (cards.has(curId)) { fillCard(cards.get(curId), designs().find(x => x.id === curId)); queueThumbs([curId]); }
}
function closeViewer() { viewer.hidden = true; document.body.style.overflow = ''; stopSpin(); refreshCard(); }
function step(dir) {
  const ids = designs().map(d => d.id), i = ids.indexOf(curId);
  persist(); refreshCard();
  openViewer(ids[(i + dir + ids.length) % ids.length], cur.xray);
}

const KEYS = Object.keys(BASE).filter(k => k !== 'xray').concat(['name']);
const pick = o => Object.fromEntries(KEYS.map(k => [k, o[k]]));
function persist() {
  const custom = store.custom.find(c => c.id === curId);
  if (custom) { Object.assign(custom, pick(cur)); saveStore(); return; }
  const preset = { ...BASE, ...PRESETS.find(p => p.id === curId) }, diff = {};
  for (const k of KEYS) if (cur[k] !== preset[k]) diff[k] = cur[k];
  if (Object.keys(diff).length) store.edits[curId] = diff; else delete store.edits[curId];
  saveStore();
}
function set(k, v, reframe = false) { cur[k] = v; if (k !== 'xray') persist(); rebuild(reframe); }

const SLIDERS = [
  ['nose', 'Nose', 0, 1, 0.01, ''], ['flare', 'Flare', 0, 1, 0.01, ''], ['chine', 'Chine', 0, 1, 0.01, ''],
  ['barrelLen', 'Barrel', 20, 34, 1, 'in'], ['elev', 'Elevation', 0, 90, 1, '°'], ['drumN', 'Drum', 5, 8, 1, ''],
  ['glow', 'Glow', 0, 1.6, 0.05, '×'],
];
const TOGGLES = [['xray', 'X-ray'], ['band', 'Belt band'], ['skirtGlow', 'Skirt glow'], ['underglow', 'Underglow'], ['rings', 'Rings'], ['podBand', 'Slot glow']];

function chips(label, opts, val, onPick) {
  const wrap = document.createElement('div'); wrap.className = 'grp';
  wrap.innerHTML = `<div class="lbl">${label}</div><div class="chips"></div>`;
  const row = wrap.querySelector('.chips');
  for (const [k, name] of Object.entries(opts)) {
    const b = document.createElement('button');
    b.className = 'chip' + (k === val ? ' on' : ''); b.textContent = name;
    b.addEventListener('click', () => { row.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on'); onPick(k); });
    row.appendChild(b);
  }
  return wrap;
}

function buildPanel() {
  panel.innerHTML = '';
  const nameG = document.createElement('div'); nameG.className = 'grp';
  nameG.innerHTML = `<label for="name">Name</label><input id="name" maxlength="28">`;
  const nameIn = nameG.querySelector('input'); nameIn.value = cur.name;
  nameIn.addEventListener('input', () => { cur.name = nameIn.value || 'Untitled'; persist(); document.getElementById('vtitle').innerHTML = `${escapeHtml(cur.name)}<span>${LAYOUTS[cur.layout]}</span>`; });
  panel.appendChild(nameG);
  panel.appendChild(chips('Barrels', LAYOUTS, cur.layout, k => { set('layout', k, true); buildPanel(); }));
  panel.appendChild(chips('Hull', HULLS, cur.hull, k => set('hull', k, true)));
  panel.appendChild(chips('Turret', PODS, cur.pod, k => set('pod', k)));

  const sg = document.createElement('div'); sg.className = 'grp';
  sg.innerHTML = `<div class="lbl">Shape</div>`;
  for (const [k, label, min, max, st, unit] of SLIDERS) {
    if (k === 'drumN' && cur.layout !== 'revolver') continue;
    const row = document.createElement('label'); row.className = 'slider';
    row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${st}"><output></output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    const show = v => out.textContent = `${+(+v).toFixed(2)}${unit}`;
    inp.value = cur[k]; show(cur[k]);
    inp.addEventListener('input', () => { show(inp.value); set(k, +inp.value); });
    sg.appendChild(row);
  }
  panel.appendChild(sg);

  const tg = document.createElement('div'); tg.className = 'grp';
  tg.innerHTML = `<div class="lbl">View & accents</div><div class="toggles"></div>`;
  for (const [k, label] of TOGGLES) {
    const row = document.createElement('label'); row.className = 'toggle';
    row.innerHTML = `<input type="checkbox" data-k="${k}"><span>${label}</span>`;
    const inp = row.querySelector('input'); inp.checked = !!cur[k];
    inp.addEventListener('change', () => set(k, inp.checked));
    tg.querySelector('.toggles').appendChild(row);
  }
  panel.appendChild(tg);

  const cg = document.createElement('div'); cg.className = 'grp';
  cg.innerHTML = `<div class="lbl">LED colour</div><div class="color-row"><input type="color"><button class="chip" id="redReset">Brophy red</button></div>`;
  const col = cg.querySelector('input'); col.value = cur.led;
  col.addEventListener('input', () => set('led', col.value));
  cg.querySelector('#redReset').addEventListener('click', () => { col.value = RED; set('led', RED); });
  panel.appendChild(cg);
  panel.appendChild(chips('Backdrop', { dark: 'Dark', light: 'Light' }, cur.backdrop, k => set('backdrop', k)));

  const act = document.createElement('div'); act.className = 'grp';
  act.innerHTML = `<div class="actions">
      <button class="btn primary" id="aPng">Export PNG</button>
      <button class="btn" id="aJson">Copy JSON</button>
      <button class="btn" id="aDup">Save as new</button>
      <button class="btn" id="aReset">${store.custom.some(c => c.id === curId) ? 'Delete' : 'Reset'}</button>
    </div>`;
  act.querySelector('#aPng').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = shot(cur, 2400, 1600, 'image/png').url;
    a.download = `mark5-${cur.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}${cur.xray ? '-xray' : ''}.png`;
    a.click(); toast('PNG saved');
  });
  act.querySelector('#aJson').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(pick(cur), null, 2)); toast('Config copied'); }
    catch { toast('Clipboard blocked'); }
  });
  act.querySelector('#aDup').addEventListener('click', () => {
    const id = 'u' + Date.now().toString(36);
    store.custom.push({ ...pick(cur), id, name: cur.name + ' 2' });
    saveStore(); renderGrid(); openViewer(id); toast('Saved under Yours');
  });
  act.querySelector('#aReset').addEventListener('click', () => {
    if (store.custom.some(c => c.id === curId)) {
      store.custom = store.custom.filter(c => c.id !== curId); saveStore(); closeViewer(); renderGrid(); return;
    }
    delete store.edits[curId]; saveStore(); openViewer(curId); toast('Back to the original');
  });
  panel.appendChild(act);
}

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1600);
}

let spinRaf = 0;
function spinLoop() {
  const p = vCam.position.clone().sub(controls.target);
  p.applyAxisAngle(V3(0, 1, 0), 0.006);
  vCam.position.copy(controls.target).add(p); controls.update();
  spinRaf = requestAnimationFrame(spinLoop);
}
function stopSpin() { spinning = false; cancelAnimationFrame(spinRaf); document.getElementById('spin').classList.remove('on'); }
document.getElementById('spin').addEventListener('click', () => {
  if (spinning) return stopSpin();
  spinning = true; document.getElementById('spin').classList.add('on'); spinLoop();
});
function toggleXray() {
  set('xray', !cur.xray);
  const box = panel.querySelector('input[data-k="xray"]'); if (box) box.checked = cur.xray;
}
document.getElementById('xray').addEventListener('click', toggleXray);
document.getElementById('home').addEventListener('click', () => { frame(vCam, vStage.robot, controls); draw(); });
document.getElementById('close').addEventListener('click', closeViewer);
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
addEventListener('keydown', e => {
  if (viewer.hidden || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'x') toggleXray();
});

renderGrid();

// hooks for the batch export script (harmless otherwise)
window.mk5 = {
  designs, open: openViewer, THREE, build, makeStage, makeRenderer,
  renderAll: (w = 1200, h = 800, xray = false) => designs().map(d => {
    const { url, info } = shot({ ...d, xray }, w, h);
    return { id: d.id, name: d.name, layout: d.layout, meta: `${LAYOUTS[d.layout]}${LAYOUT_NOTE[d.layout] ? ' ' + LAYOUT_NOTE[d.layout] : ''} · ${HULLS[d.hull]} · ${PODS[d.pod]} turret`, fails: info.fails, w: info.overallW, l: info.overallL, h: info.height, url };
  }),
};
</script>
</body>
</html>
